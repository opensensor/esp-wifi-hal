[package]
name = "examples"
version = "0.1.0"
authors = ["Frostie314159 <frostie.neuenhausen@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]

esp-wifi-hal = { path = "../esp-wifi-hal/", features = ["log"] }

# ESP-HAL dependencies
esp-hal = { version = "1.1.0", features = ["unstable"] }
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println"] }

# Embassy dependencies

# Misc
log = "0.4.28"
static_cell = { version = "2.1.1" }
embedded-io-async = "0.7.0"
embassy-futures = "0.1.2"
embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-sync = "0.8.0"
rand_core = "0.9.3"
embedded-io = "0.7.1"
esp-rtos = { version = "0.3.0", features = ["embassy"] }
esp-println = { version = "0.16.1", features = ["log-04"] }
esp-bootloader-esp-idf = "0.5.0"
ieee80211 = "0.5.9"
foa = { version = "0.2.0", features = ["log"], optional = true }
foa_sta = { version = "0.2.0", features = ["log"], optional = true }
embassy-net-driver = { version = "0.2", optional = true }
embassy-net = { version = "0.9.1", features = [
    "proto-ipv4", "dhcpv4", "icmp", "auto-icmp-echo-reply", "medium-ethernet",
], optional = true }
smoltcp = { version = "=0.13.1", default-features = false, features = ["iface-pending-responses"], optional = true }

[[bin]]
name = "sta_smoke"
path = "src/bin/sta_smoke.rs"
required-features = ["foa-smoke"]

[[bin]]
name = "tsf_timer_test"
path = "src/bin/tsf_timer_test.rs"
required-features = ["esp32c3"]

[features]
foa-smoke = ["dep:foa", "dep:foa_sta", "dep:embassy-net", "dep:smoltcp"]
network-trace = ["foa-smoke", "smoltcp/log", "embassy-net/log", "dep:embassy-net-driver"]

esp32 = [
    "esp-wifi-hal/esp32",
    "esp-hal/esp32",
    "esp-rtos/esp32",
    "esp-backtrace/esp32",
    "esp-bootloader-esp-idf/esp32",
]
esp32s2 = [
    "esp-wifi-hal/esp32s2",
    "esp-hal/esp32s2",
    "esp-rtos/esp32s2",
    "esp-backtrace/esp32s2",
    "esp-bootloader-esp-idf/esp32s2",
]
esp32c3 = [
    "esp-wifi-hal/esp32c3",
    "esp-hal/esp32c3",
    "esp-rtos/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-bootloader-esp-idf/esp32c3",
]

esp32s3 = [
    "esp-wifi-hal/esp32s3",
    "esp-hal/esp32s3",
    "esp-rtos/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 's'
overflow-checks = false

[patch.crates-io]
# Generation-safe completion ownership and cancellation recovery in the TX queue.
foa = { git = "https://github.com/opensensor/FoA", rev = "2985c2e5105a11047494885f75f33c3bcb3192e5" }
foa_sta = { git = "https://github.com/opensensor/FoA", rev = "2985c2e5105a11047494885f75f33c3bcb3192e5" }
# FoA must use the driver under test too.
esp-wifi-hal = { path = "../esp-wifi-hal" }
# Retain automatic ICMP/TCP responses while ARP resolves, including embassy-net's stack.
smoltcp = { git = "https://github.com/opensensor/smoltcp", rev = "517222f7318c092d82197e2e68cfccca0f460b09" }
# S3 Wi-Fi registers pending an upstream PAC release (0.35 compatibility branch).
esp32s3 = { git = "https://github.com/opensensor/esp-pacs", rev = "37b54bd9ad62de17b17a8d7984a2ace5e73d63dd" }
# esp32c3 PAC with the Wi-Fi MAC register block (esp-rs/esp-pacs#510), on top of the 0.32.3 release.
esp32c3 = { git = "https://github.com/opensensor/esp-pacs", rev = "9be190016260ef195c97f7aa5aa7c576a1646890" }
