name: Host regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: C and Rust HAL regressions
        run: sh docs/esp32s3/tests/run-rust-tests.sh
      - name: Compare PHY dispatcher to original instructions
        run: sh docs/network/tests/run-phy-dispatcher.sh
      - name: Count only live PHY and formatter allocations
        run: |
          python3 docs/network/tests/test_audit_phy_allocations.py
          python3 -O docs/network/tests/test_audit_phy_allocations.py
      - name: Reproduce smoltcp neighbor-cache behavior
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/esp32s3/tests/neighbor-repro/Cargo.toml
      - name: Retain replies through ARP and embassy MAC refreshes
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/network/tests/pending-response-repro/Cargo.toml
      - name: Retain a five-per-second echo burst until ARP expiry
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/network/tests/pending-response-repro/Cargo.toml --features burst32
      - name: Preserve MAC retry identity and duplicate suppression
        run: |
          sh docs/network/tests/run-mac-retry.sh
          sh docs/network/tests/run-mac-retry.sh --release
      - name: Detect incomplete raw capture streams
        run: |
          python3 -m pip install pyserial==3.5
          rustc --edition 2024 --test examples/src/capture_protocol.rs -o /tmp/capture-protocol-tests
          /tmp/capture-protocol-tests
          python3 -m unittest discover -s docs/network/tools/raw-capture -p 'test_*.py'
