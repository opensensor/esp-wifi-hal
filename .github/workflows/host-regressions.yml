name: Host regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: C and Rust HAL regressions
        run: sh docs/esp32s3/tests/run-rust-tests.sh
      - name: Compare PHY dispatcher to original instructions
        run: sh docs/network/tests/run-phy-dispatcher.sh
      - name: Compare PHY temperature path to original instructions
        run: sh docs/network/tests/run-phy-temperature.sh
      - name: Compare sensor lifecycle to original instructions
        run: sh docs/network/tests/run-phy-lifecycle.sh
      - name: Compare PBUS programming to original instructions
        run: sh docs/network/tests/run-phy-pbus.sh
      - name: Compare analog I2C setup to original instructions
        run: sh docs/network/tests/run-phy-i2c.sh
      - name: Compare PHY API lifecycle to original instructions
        run: sh docs/network/tests/run-phy-api.sh
      - name: Compare basic PHY helpers to original instructions
        run: sh docs/network/tests/run-phy-basic.sh
      - name: Compare PHY feature helpers to original instructions
        run: sh docs/network/tests/run-phy-feature.sh
      - name: Compare PHY debug helpers to original instructions
        run: sh docs/network/tests/run-phy-debug.sh
      - name: Compare power detector to original instructions
        run: sh docs/network/tests/run-phy-pwdet.sh
      - name: Compare RC measurement and calibration to original instructions
        run: sh docs/network/tests/run-phy-analog.sh
      - name: Compare PHY tracking to original instructions
        run: sh docs/network/tests/run-phy-track.sh
      - name: Compare RF PLL and channel helpers to original instructions
        run: sh docs/network/tests/run-phy-rfpll.sh
      - name: Compare hardware frequency control to original instructions
        run: sh docs/network/tests/run-phy-hw-freq.sh
      - name: Count only live PHY and formatter allocations
        run: |
          python3 docs/network/tests/test_audit_phy_allocations.py
          python3 -O docs/network/tests/test_audit_phy_allocations.py
          python3 docs/network/tests/test_audit_phy_temperature.py
          python3 -O docs/network/tests/test_audit_phy_temperature.py
          python3 docs/network/tests/test_audit_phy_lifecycle.py
          python3 -O docs/network/tests/test_audit_phy_lifecycle.py
          python3 docs/network/tests/test_audit_phy_pbus.py
          python3 -O docs/network/tests/test_audit_phy_pbus.py
          python3 docs/network/tests/test_audit_phy_i2c.py
          python3 -O docs/network/tests/test_audit_phy_i2c.py
          python3 docs/network/tests/test_audit_phy_api.py
          python3 -O docs/network/tests/test_audit_phy_api.py
          python3 docs/network/tests/test_audit_phy_basic.py
          python3 -O docs/network/tests/test_audit_phy_basic.py
          python3 docs/network/tests/test_audit_phy_feature.py
          python3 -O docs/network/tests/test_audit_phy_feature.py
          python3 docs/network/tests/test_audit_phy_debug.py
          python3 -O docs/network/tests/test_audit_phy_debug.py
          python3 docs/network/tests/test_audit_phy_pwdet.py
          python3 -O docs/network/tests/test_audit_phy_pwdet.py
          python3 docs/network/tests/test_audit_phy_analog.py
          python3 -O docs/network/tests/test_audit_phy_analog.py
          python3 docs/network/tests/test_audit_phy_track.py
          python3 -O docs/network/tests/test_audit_phy_track.py
          python3 docs/network/tests/test_audit_phy_rfpll.py
          python3 -O docs/network/tests/test_audit_phy_rfpll.py
          python3 docs/network/tests/test_audit_phy_hw_freq.py
          python3 -O docs/network/tests/test_audit_phy_hw_freq.py
      - name: Reproduce smoltcp neighbor-cache behavior
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/esp32s3/tests/neighbor-repro/Cargo.toml
      - name: Retain replies through ARP and embassy MAC refreshes
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/network/tests/pending-response-repro/Cargo.toml
      - name: Retain a five-per-second echo burst until ARP expiry
        run: >-
          cargo +stable test --locked --target x86_64-unknown-linux-gnu
          --manifest-path docs/network/tests/pending-response-repro/Cargo.toml --features burst32
      - name: Preserve MAC retry identity and duplicate suppression
        run: |
          sh docs/network/tests/run-mac-retry.sh
          sh docs/network/tests/run-mac-retry.sh --release
      - name: Detect incomplete raw capture streams
        run: |
          python3 -m pip install pyserial==3.5
          rustc --edition 2024 --test examples/src/capture_protocol.rs -o /tmp/capture-protocol-tests
          /tmp/capture-protocol-tests
          python3 -m unittest discover -s docs/network/tools/raw-capture -p 'test_*.py'
